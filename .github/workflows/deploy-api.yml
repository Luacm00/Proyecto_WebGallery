name: Deploy API

on:
  push:
    branches: [master]
    paths: # solo si cambió algo que afecta a la API
      - "apps/api/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos despliegues a la vez; el nuevo espera al anterior.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production # da acceso a los secretos del entorno
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api typecheck # última verificación antes de publicar

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter api run deploy
