# El sitio se mudó a Cloudflare Pages. Netlify solo redirige (301) al dominio nuevo.
[build]
  command = "echo 'Sin build: Netlify solo redirige a Cloudflare Pages'"
  publish = "apps/web/public"   # carpeta existente; su contenido no se sirve (force = true)

[[redirects]]
  from = "/*"
  to = "https://webgallery-2bc.pages.dev/:splat"
  status = 301
  force = true                  # redirige SIEMPRE, aunque exista un archivo con ese nombre
