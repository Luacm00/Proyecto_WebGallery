[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  # Evita el <script> inline de CRA para poder usar una CSP estricta (script-src 'self').
  INLINE_RUNTIME_CHUNK = "false"
  GENERATE_SOURCEMAP = "false"

# URLs antiguas (con .js) -> rutas nuevas
[[redirects]]
  from = "/Tecnicas.js"
  to = "/tecnicas"
  status = 301
[[redirects]]
  from = "/Categorias.js"
  to = "/categorias"
  status = 301
[[redirects]]
  from = "/Nosotros.js"
  to = "/nosotros"
  status = 301
[[redirects]]
  from = "/categorias/Oleo.js"
  to = "/categorias/oleo"
  status = 301
[[redirects]]
  from = "/categorias/Acrilico.js"
  to = "/categorias/acrilico"
  status = 301
[[redirects]]
  from = "/categorias/Vinilo.js"
  to = "/categorias/vinilo"
  status = 301
[[redirects]]
  from = "/categorias/Carboncillo.js"
  to = "/categorias/carboncillo"
  status = 301
[[redirects]]
  from = "/categorias/TizasPastel.js"
  to = "/categorias/tizas-pastel"
  status = 301

# Fallback SPA: React Router resuelve la ruta en el cliente
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
